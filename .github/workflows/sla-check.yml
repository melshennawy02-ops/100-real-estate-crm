name: SLA Auto-Reassign Check

# بيشتغل تلقائيًا كل 15 دقيقة، على مدار الساعة، مجانًا بالكامل.
# تقدر كمان تشغّله يدويًا من تبويب Actions فوق في الريبو (زرار Run workflow).
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Run SLA check
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node sla-check.js
