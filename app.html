<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>100% Real Estate — CRM</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="loading-screen" id="loadingScreen">
  <div class="spinner"></div>
  <div id="loadingFallback" style="display:none; text-align:center; max-width:280px; padding:0 20px;">
    <div style="color:var(--slate); font-size:13px; margin-bottom:14px;">الاتصال بطيء أو انقطع. تأكد من الإنترنت وحاول تاني.</div>
    <button onclick="window.location.reload()" class="btn-gold" style="width:100%;">إعادة المحاولة</button>
  </div>
</div>

<div class="app-shell" id="appShell" style="display:none">

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <span class="ring-mark"></span>
      <div class="sidebar-brand-text">100%<small data-i18n="brandSub">REAL ESTATE</small></div>
    </div>

    <nav>
      <a href="#dashboard" class="nav-item" data-view="dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="5" rx="1.5"/><rect x="13" y="11" width="8" height="10" rx="1.5"/><rect x="3" y="14" width="8" height="7" rx="1.5"/></svg>
        <span data-i18n="nav_dashboard">Dashboard</span>
      </a>
      <a href="#leads" class="nav-item" data-view="leads">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17.5" cy="8.5" r="2.5"/><path d="M15.5 14.2c2.6.4 4.5 2.6 4.5 5.3"/></svg>
        <span data-i18n="nav_leads">Leads</span>
      </a>
      <a href="#pipeline" class="nav-item" data-view="pipeline">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 5h18M3 12h18M3 19h18"/><circle cx="7" cy="5" r="1.6" fill="currentColor" stroke="none"/><circle cx="14" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="10" cy="19" r="1.6" fill="currentColor" stroke="none"/></svg>
        <span data-i18n="nav_pipeline">Pipeline</span>
      </a>
      <a href="#tasks" class="nav-item" data-view="tasks">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 10h18"/><path d="M7.5 14l2 2 3.5-3.5"/></svg>
        <span data-i18n="nav_tasks">Tasks</span>
      </a>
      <a href="#reports" class="nav-item" data-view="reports">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20V10M12 20V4M20 20v-7"/></svg>
        <span data-i18n="nav_reports">Reports</span>
      </a>
    </nav>

    <div class="sidebar-foot">
      <div class="user-chip">
        <div class="user-avatar" id="userAvatar">--</div>
        <div class="user-meta">
          <div class="name" id="userName">—</div>
          <div class="role" id="userEmail">—</div>
        </div>
      </div>
      <div style="display:flex; gap:6px; margin-top:10px;">
        <div class="lang-toggle" style="flex:1; justify-content:center;">
          <button data-lang="ar">AR</button>
          <button data-lang="en">EN</button>
        </div>
      </div>
      <button class="logout-btn" id="logoutBtn" data-i18n="logout">Logout</button>
    </div>
  </aside>

  <!-- Main -->
  <div class="main">
    <div class="topbar">
      <div style="display:flex; align-items:center; gap:12px;">
        <button class="menu-btn" id="menuBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
        <div>
          <h1 id="pageTitle" data-i18n="dash_title">Dashboard</h1>
          <div class="topbar-sub" id="pageSub" data-i18n="dash_sub">Today's performance overview</div>
        </div>
      </div>
      <div class="topbar-actions" id="topbarActions"></div>
    </div>

    <div class="content" id="content"></div>
  </div>
</div>

<!-- Modal: Lead -->
<div class="modal-backdrop" id="leadModal">
  <div class="modal">
    <div class="modal-head">
      <h3 id="leadModalTitle" data-i18n="modal_add_lead">Add Lead</h3>
      <button class="modal-close" data-close-modal="leadModal">✕</button>
    </div>
    <form id="leadForm">
      <input type="hidden" id="leadId">
      <div class="form-grid">
        <div class="field full">
          <label data-i18n="f_name">Full Name</label>
          <input type="text" id="leadName" required>
        </div>
        <div class="field">
          <label data-i18n="f_phone">Phone</label>
          <input type="tel" id="leadPhone" required>
        </div>
        <div class="field">
          <label data-i18n="f_email">Email</label>
          <input type="email" id="leadEmail">
        </div>
        <div class="field">
          <label data-i18n="f_interest">Interest</label>
          <input type="text" id="leadInterest">
        </div>
        <div class="field">
          <label data-i18n="f_budget">Budget</label>
          <input type="text" id="leadBudget">
        </div>
        <div class="field">
          <label data-i18n="f_source">Source</label>
          <select id="leadSource">
            <option value="facebook" data-i18n="source_facebook">Facebook</option>
            <option value="website" data-i18n="source_website">Website</option>
            <option value="referral" data-i18n="source_referral">Referral</option>
            <option value="walkin" data-i18n="source_walkin">Walk-in</option>
            <option value="call" data-i18n="source_call">Call</option>
            <option value="other" data-i18n="source_other">Other</option>
          </select>
        </div>
        <div class="field">
          <label data-i18n="f_status">Status</label>
          <select id="leadStatus">
            <option value="new" data-i18n="status_new">New</option>
            <option value="contacted" data-i18n="status_contacted">Contacted</option>
            <option value="qualified" data-i18n="status_qualified">Qualified</option>
            <option value="negotiation" data-i18n="status_negotiation">Negotiation</option>
            <option value="won" data-i18n="status_won">Won</option>
            <option value="lost" data-i18n="status_lost">Lost</option>
          </select>
        </div>
        <div class="field">
          <label data-i18n="f_rating">Rating</label>
          <select id="leadRating">
            <option value="hot" data-i18n="rating_hot">Hot</option>
            <option value="warm" data-i18n="rating_warm">Warm</option>
            <option value="cold" data-i18n="rating_cold">Cold</option>
          </select>
        </div>
        <div class="field full">
          <label data-i18n="f_notes">Notes</label>
          <textarea id="leadNotes"></textarea>
        </div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-outline" data-close-modal="leadModal" data-i18n="cancel">Cancel</button>
        <button type="submit" class="btn-gold" data-i18n="save">Save</button>
      </div>
    </form>
  </div>
</div>

<!-- Modal: Task -->
<div class="modal-backdrop" id="taskModal">
  <div class="modal">
    <div class="modal-head">
      <h3 data-i18n="modal_add_task">Add Task</h3>
      <button class="modal-close" data-close-modal="taskModal">✕</button>
    </div>
    <form id="taskForm">
      <div class="field">
        <label data-i18n="f_task_title">Task Title</label>
        <input type="text" id="taskTitle" required>
      </div>
      <div class="form-grid" style="margin-top:14px;">
        <div class="field">
          <label data-i18n="f_task_lead">Related Lead</label>
          <select id="taskLead"></select>
        </div>
        <div class="field">
          <label data-i18n="f_task_type">Type</label>
          <select id="taskType">
            <option value="call" data-i18n="type_call">Call</option>
            <option value="visit" data-i18n="type_visit">Visit</option>
            <option value="email" data-i18n="type_email">Email</option>
            <option value="meeting" data-i18n="type_meeting">Meeting</option>
          </select>
        </div>
        <div class="field full">
          <label data-i18n="f_task_due">Due Date</label>
          <input type="date" id="taskDue" required>
        </div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-outline" data-close-modal="taskModal" data-i18n="cancel">Cancel</button>
        <button type="submit" class="btn-gold" data-i18n="save">Save</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script src="js/i18n.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
