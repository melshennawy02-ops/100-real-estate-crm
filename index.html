<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>100% Real Estate — CRM</title>
<style>
/* =========================================================
   100% Real Estate Consultants — CRM (single-file build)
   ========================================================= */
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap');

:root{
  --navy-deep:   #F6F1E3;
  --navy:        #FBF8EF;
  --navy-panel:  #FFFFFF;
  --navy-panel-2:#F2EAD4;
  --navy-line:   #DCCEA3;
  --gold:        #A5793A;
  --gold-bright: #6E4E1E;
  --gold-dim:    #C9A24B;
  --ivory:       #17253F;
  --slate:       #5B6B8C;
  --slate-dim:   #8B98B0;
  --danger:      #A6392C;
  --success:     #276B4E;

  --radius-lg: 18px;
  --radius-md: 12px;
  --radius-sm: 8px;
  --shadow: 0 10px 30px rgba(80,60,20,.12);
  --font: 'Cairo', 'Segoe UI', Tahoma, sans-serif;
}

*{ box-sizing:border-box; margin:0; padding:0; }

html,body{ height:100%; font-family:var(--font); background:var(--navy-deep); color:var(--ivory); }

body{
  background:
    radial-gradient(1200px 600px at 15% -10%, rgba(165,121,58,.07), transparent 60%),
    radial-gradient(900px 500px at 110% 10%, rgba(165,121,58,.06), transparent 55%),
    var(--navy-deep);
  min-height:100vh;
}

html[dir="rtl"] body{ direction:rtl; }
html[dir="ltr"] body{ direction:ltr; }

a{ color:inherit; text-decoration:none; }
button{ font-family:var(--font); cursor:pointer; border:none; }
input,select,textarea{ font-family:var(--font); }

.ring-mark{ width:14px; height:14px; border-radius:50%; border:2px solid var(--gold); display:inline-block; position:relative; }
.ring-mark::after{ content:""; position:absolute; inset:-6px; border:1px solid rgba(201,162,75,.35); border-radius:50%; }

::-webkit-scrollbar{ width:8px; height:8px; }
::-webkit-scrollbar-thumb{ background:var(--navy-line); border-radius:8px; }
::-webkit-scrollbar-track{ background:transparent; }

/* ---- Login ---- */
.login-shell{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; position:relative; overflow:hidden; }
.login-shell::before{
  content:""; position:absolute; inset:0;
  background-image:
    repeating-linear-gradient(115deg, rgba(233,204,126,.035) 0px, rgba(233,204,126,.035) 1px, transparent 1px, transparent 90px),
    repeating-linear-gradient(25deg, rgba(233,204,126,.025) 0px, rgba(233,204,126,.025) 1px, transparent 1px, transparent 140px);
  pointer-events:none;
}
.login-card{ position:relative; width:100%; max-width:420px; background:linear-gradient(180deg, var(--navy-panel), var(--navy)); border:1px solid var(--navy-line); border-radius:var(--radius-lg); box-shadow:var(--shadow); padding:40px 34px 34px; }
.brand-emblem{ width:76px; height:76px; margin:0 auto 14px; border-radius:50%; border:2px solid var(--gold); display:flex; align-items:center; justify-content:center; position:relative; }
.brand-emblem::after{ content:""; position:absolute; inset:-8px; border:1px solid rgba(201,162,75,.3); border-radius:50%; }
.brand-emblem svg{ width:38px; height:38px; }
.brand-title{ text-align:center; font-weight:800; font-size:30px; letter-spacing:.5px; background:linear-gradient(180deg, var(--gold-bright), var(--gold)); -webkit-background-clip:text; background-clip:text; color:transparent; }
.brand-sub{ text-align:center; color:var(--slate); font-size:13px; letter-spacing:2px; margin-top:4px; text-transform:uppercase; }
.lang-toggle{ position:absolute; top:18px; inset-inline-end:18px; display:flex; gap:4px; background:rgba(0,0,0,.25); border:1px solid var(--navy-line); border-radius:20px; padding:3px; }
.lang-toggle button{ background:transparent; color:var(--slate); font-size:12px; font-weight:700; padding:5px 12px; border-radius:16px; }
.lang-toggle button.active{ background:var(--gold); color:#fff; }
.field{ margin-top:20px; }
.field label{ display:block; font-size:12px; color:var(--slate); margin-bottom:6px; letter-spacing:.3px; }
.field input, .field select, .field textarea{ width:100%; background:var(--navy); border:1px solid var(--navy-line); color:var(--ivory); padding:12px 14px; border-radius:var(--radius-sm); font-size:14px; outline:none; transition:border-color .15s; }
.field input:focus, .field select:focus, .field textarea:focus{ border-color:var(--gold); }
.field textarea{ resize:vertical; min-height:70px; }
.btn-primary{ width:100%; margin-top:24px; background:linear-gradient(180deg, var(--gold-dim), var(--gold)); color:var(--ivory); font-weight:800; padding:13px; border-radius:var(--radius-sm); font-size:15px; letter-spacing:.3px; transition:transform .12s, box-shadow .12s; }
.btn-primary:hover{ transform:translateY(-1px); box-shadow:0 8px 20px rgba(201,162,75,.25); }
.btn-primary:active{ transform:translateY(0); }
.btn-primary:disabled{ opacity:.6; transform:none; box-shadow:none; cursor:default; }
.login-error{ margin-top:16px; background:rgba(166,57,44,.08); border:1px solid rgba(166,57,44,.3); color:var(--danger); font-size:13px; padding:10px 12px; border-radius:var(--radius-sm); display:none; }
.login-error.show{ display:block; }
.login-foot{ text-align:center; margin-top:22px; font-size:11px; color:var(--slate-dim); letter-spacing:.5px; }

/* ---- App shell ---- */
.app-shell{ display:flex; min-height:100vh; }
.sidebar{ width:230px; flex-shrink:0; background:linear-gradient(180deg, var(--navy-panel), var(--navy-deep)); border-inline-end:1px solid var(--navy-line); display:flex; flex-direction:column; padding:22px 14px; }
.sidebar-brand{ display:flex; align-items:center; gap:10px; padding:0 8px 22px; border-bottom:1px solid var(--navy-line); margin-bottom:18px; }
.sidebar-brand .ring-mark{ width:20px; height:20px; }
.sidebar-brand-text{ font-weight:800; font-size:16px; color:var(--gold-bright); line-height:1.1; }
.sidebar-brand-text small{ display:block; font-weight:400; color:var(--slate); font-size:10px; letter-spacing:1.5px; margin-top:2px; }
.nav-item{ display:flex; align-items:center; gap:12px; padding:11px 14px; border-radius:var(--radius-sm); color:var(--slate); font-size:14px; font-weight:600; margin-bottom:4px; transition:background .12s, color .12s; }
.nav-item svg{ width:18px; height:18px; flex-shrink:0; opacity:.85; }
.nav-item:hover{ background:rgba(233,204,126,.06); color:var(--ivory); }
.nav-item.active{ background:linear-gradient(90deg, rgba(201,162,75,.18), rgba(201,162,75,.02)); color:var(--gold-bright); border-inline-start:3px solid var(--gold); padding-inline-start:11px; }
.sidebar-foot{ margin-top:auto; padding-top:16px; border-top:1px solid var(--navy-line); }
.user-chip{ display:flex; align-items:center; gap:10px; padding:8px; border-radius:var(--radius-sm); }
.user-avatar{ width:34px; height:34px; border-radius:50%; background:var(--navy-panel-2); border:1px solid var(--gold-dim); display:flex; align-items:center; justify-content:center; font-weight:800; color:var(--gold); font-size:13px; }
.user-meta{ line-height:1.2; overflow:hidden; }
.user-meta .name{ font-size:13px; font-weight:700; color:var(--ivory); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.user-meta .role{ font-size:11px; color:var(--slate); }
.logout-btn{ width:100%; margin-top:10px; background:transparent; border:1px solid var(--navy-line); color:var(--slate); padding:8px; border-radius:var(--radius-sm); font-size:12px; font-weight:700; transition:border-color .12s, color .12s; }
.logout-btn:hover{ border-color:var(--danger); color:var(--danger); }

.main{ flex:1; min-width:0; display:flex; flex-direction:column; }
.topbar{ display:flex; align-items:center; justify-content:space-between; padding:18px 28px; border-bottom:1px solid var(--navy-line); gap:16px; }
.topbar h1{ font-size:20px; font-weight:800; color:var(--ivory); }
.topbar-sub{ font-size:12px; color:var(--slate); margin-top:2px; }
.topbar-actions{ display:flex; align-items:center; gap:10px; }
.btn-gold{ background:linear-gradient(180deg, var(--gold-dim), var(--gold)); color:#fff; font-weight:800; font-size:13px; padding:10px 16px; border-radius:var(--radius-sm); display:inline-flex; align-items:center; gap:6px; transition:transform .12s; }
.btn-gold:hover{ transform:translateY(-1px); }
.btn-outline{ background:transparent; border:1px solid var(--navy-line); color:var(--ivory); font-size:13px; font-weight:700; padding:9px 14px; border-radius:var(--radius-sm); }
.btn-outline:hover{ border-color:var(--gold); color:var(--gold-bright); }
.content{ flex:1; padding:24px 28px 40px; overflow-y:auto; }

.stat-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:24px; }
.stat-card{ background:linear-gradient(180deg, var(--navy-panel), var(--navy)); border:1px solid var(--navy-line); border-radius:var(--radius-lg); padding:18px 20px; position:relative; overflow:hidden; }
.stat-card::after{ content:""; position:absolute; top:-30px; inset-inline-end:-30px; width:90px; height:90px; border:1px solid rgba(201,162,75,.15); border-radius:50%; }
.stat-label{ font-size:12px; color:var(--slate); font-weight:600; letter-spacing:.3px; }
.stat-value{ font-size:30px; font-weight:800; margin-top:8px; color:var(--gold-bright); }

.panel{ background:linear-gradient(180deg, var(--navy-panel), var(--navy)); border:1px solid var(--navy-line); border-radius:var(--radius-lg); padding:20px; margin-bottom:22px; }
.panel-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; flex-wrap:wrap; gap:12px; }
.panel-head h2{ font-size:15px; font-weight:800; color:var(--ivory); }

table{ width:100%; border-collapse:collapse; }
thead th{ text-align:start; font-size:11px; color:var(--slate); text-transform:uppercase; letter-spacing:.5px; font-weight:700; padding:0 10px 10px; border-bottom:1px solid var(--navy-line); }
tbody td{ padding:12px 10px; font-size:13.5px; border-bottom:1px solid rgba(36,64,111,.12); color:var(--ivory); }
tbody tr:hover{ background:rgba(233,204,126,.04); }
tbody tr:last-child td{ border-bottom:none; }

.badge{ display:inline-flex; align-items:center; gap:5px; padding:4px 10px; border-radius:20px; font-size:11px; font-weight:700; }
.badge.new{ background:rgba(143,160,194,.15); color:var(--slate); }
.badge.contacted{ background:rgba(201,162,75,.15); color:var(--gold-bright); }
.badge.qualified{ background:rgba(78,156,130,.15); color:var(--success); }
.badge.matched{ background:rgba(201,162,75,.15); color:var(--gold-bright); }
.badge.meeting{ background:rgba(91,107,140,.18); color:var(--ivory); }
.badge.offer{ background:rgba(39,107,78,.12); color:var(--success); }
.badge.negotiation{ background:rgba(233,204,126,.2); color:var(--gold-bright); }
.badge.booking{ background:rgba(165,121,58,.22); color:var(--gold-bright); }
.badge.contract{ background:rgba(39,107,78,.2); color:var(--success); }
.badge.won{ background:rgba(39,107,78,.15); color:var(--success); }
.badge.lost{ background:rgba(166,57,44,.12); color:var(--danger); }
.badge.hot{ background:rgba(166,57,44,.12); color:var(--danger); }
.badge.warm{ background:rgba(201,162,75,.18); color:var(--gold-bright); }
.badge.cold{ background:rgba(143,160,194,.15); color:var(--slate); }

.row-actions{ display:flex; gap:8px; }
.icon-btn{ width:30px; height:30px; border-radius:8px; background:transparent; border:1px solid var(--navy-line); display:flex; align-items:center; justify-content:center; color:var(--slate); transition:.12s; }
.icon-btn:hover{ border-color:var(--gold); color:var(--gold-bright); }
.icon-btn svg{ width:14px; height:14px; }

.empty-state{ text-align:center; padding:50px 20px; color:var(--slate); }
.empty-state .ring-mark{ width:30px; height:30px; margin-bottom:14px; }
.empty-state p{ font-size:13px; margin-top:6px; }

.pipeline-board{ display:grid; grid-auto-flow:column; grid-auto-columns:260px; gap:14px; overflow-x:auto; padding-bottom:8px; }
.pipe-col{ background:rgba(165,121,58,.05); border:1px solid var(--navy-line); border-radius:var(--radius-md); padding:12px; min-height:200px; }
.pipe-col-head{ display:flex; align-items:center; justify-content:space-between; font-size:12px; font-weight:800; color:var(--slate); text-transform:uppercase; letter-spacing:.4px; margin-bottom:10px; padding:0 4px; }
.pipe-col-head .count{ background:rgba(201,162,75,.15); color:var(--gold-bright); border-radius:10px; padding:1px 8px; font-size:11px; }
.pipe-card{ background:linear-gradient(180deg, var(--navy-panel-2), var(--navy-panel)); border:1px solid var(--navy-line); border-radius:var(--radius-sm); padding:12px; margin-bottom:10px; cursor:grab; transition:border-color .12s, transform .12s; }
.pipe-card:hover{ border-color:var(--gold-dim); }
.pipe-card.dragging{ opacity:.4; }
.pipe-card-name{ font-size:13.5px; font-weight:700; color:var(--ivory); }
.pipe-card-meta{ font-size:11.5px; color:var(--slate); margin-top:4px; }
.pipe-card-value{ font-size:13px; font-weight:800; color:var(--gold-bright); margin-top:8px; }
.pipe-col.drag-over{ border-color:var(--gold); background:rgba(201,162,75,.08); }

.modal-backdrop{ position:fixed; inset:0; background:rgba(2,6,16,.85); backdrop-filter:blur(6px); display:none; align-items:center; justify-content:center; z-index:100; padding:16px; }
.modal-backdrop.show{ display:flex; }
.modal{ width:100%; max-width:480px; max-height:90vh; overflow-y:auto; background:linear-gradient(180deg, var(--navy-panel-2), var(--navy-deep)); border:1px solid var(--gold-dim); border-radius:20px; padding:24px 22px; box-shadow:0 25px 50px rgba(60,45,15,.18), 0 0 0 1px rgba(165,121,58,.15); }
.modal-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; padding-bottom:14px; border-bottom:1px solid var(--navy-line); }
.modal-head h3{ font-size:17px; font-weight:800; color:var(--gold-bright); }
.modal-close{ width:32px; height:32px; border-radius:50%; background:rgba(255,255,255,.5); border:1px solid var(--navy-line); color:var(--slate); display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0; }
.modal-close:hover{ color:var(--ivory); border-color:var(--gold); }
.form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
.form-grid .full{ grid-column:1/-1; }
.modal-actions{ display:flex; gap:10px; margin-top:22px; }
.modal-actions button{ flex:1; }

.task-item{ display:flex; align-items:flex-start; gap:12px; padding:14px 6px; border-bottom:1px solid rgba(36,64,111,.12); }
.task-item:last-child{ border-bottom:none; }
.task-check{ width:20px; height:20px; border-radius:6px; border:1.5px solid var(--navy-line); flex-shrink:0; margin-top:2px; display:flex; align-items:center; justify-content:center; transition:.12s; cursor:pointer; }
.task-check.done{ background:var(--success); border-color:var(--success); }
.task-check.done svg{ width:12px; height:12px; color:#fff; }
.task-body{ flex:1; }
.task-title{ font-size:13.5px; font-weight:700; color:var(--ivory); }
.task-title.done{ text-decoration:line-through; color:var(--slate-dim); }
.task-meta{ font-size:11.5px; color:var(--slate); margin-top:3px; }
.task-meta.overdue{ color:var(--danger); font-weight:700; }

.toast{ position:fixed; bottom:24px; inset-inline-end:24px; background:var(--navy-panel-2); border:1px solid var(--gold-dim); color:var(--ivory); padding:13px 18px; border-radius:var(--radius-sm); font-size:13px; font-weight:600; box-shadow:var(--shadow); transform:translateY(20px); opacity:0; transition:.2s; z-index:200; pointer-events:none; }
.toast.show{ transform:translateY(0); opacity:1; }

@media (max-width:900px){
  .sidebar{ position:fixed; inset-inline-start:0; top:0; z-index:50; height:100vh; transform:translateX(-110%); transition:.2s; }
  html[dir="rtl"] .sidebar{ transform:translateX(110%); }
  .sidebar.open{ transform:translateX(0); }
  html[dir="rtl"] .sidebar.open{ transform:translateX(0); }
  .stat-grid{ grid-template-columns:repeat(2,1fr); }
  .form-grid{ grid-template-columns:1fr; }
  .content{ padding:18px; }
  .topbar{ padding:14px 18px; }
  .menu-btn{ display:flex !important; }
}
.menu-btn{ display:none; width:36px; height:36px; border-radius:8px; background:rgba(255,255,255,.5); border:1px solid var(--navy-line); align-items:center; justify-content:center; color:var(--ivory); }

.loading-screen{ position:fixed; inset:0; background:var(--navy-deep); display:flex; align-items:center; justify-content:center; z-index:999; flex-direction:column; gap:14px; }
.spinner{ width:36px; height:36px; border-radius:50%; border:3px solid var(--navy-line); border-top-color:var(--gold); animation:spin .8s linear infinite; }
@keyframes spin{ to{ transform:rotate(360deg); } }

.team-row{ display:flex; align-items:center; gap:12px; padding:12px 6px; border-bottom:1px solid rgba(36,64,111,.12); }
.team-row:last-child{ border-bottom:none; }
.team-avatar{ width:38px; height:38px; border-radius:50%; background:var(--navy-panel-2); border:1px solid var(--gold-dim); display:flex; align-items:center; justify-content:center; font-weight:800; color:var(--gold); font-size:14px; flex-shrink:0; }
.team-info{ flex:1; min-width:0; }
.team-info .name{ font-size:14px; font-weight:700; color:var(--ivory); }
.team-info .email{ font-size:12px; color:var(--slate); }

.quick-contact{ display:flex; gap:10px; margin:14px 0 18px; }
.quick-contact-btn{ width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#fff; flex-shrink:0; }
.quick-contact-btn svg{ width:19px; height:19px; }
.quick-contact-btn.call{ background:#2E9E5B; }
.quick-contact-btn.sms{ background:#3B82C4; }
.quick-contact-btn.whatsapp{ background:#25D366; }
.quick-contact-label{ display:flex; flex-direction:column; justify-content:center; }
.quick-contact-label .num{ font-size:14px; font-weight:700; color:var(--ivory); }
.quick-contact-label .lbl{ font-size:11px; color:var(--slate); }

.tag-list{ display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
.tag-chip{ display:inline-flex; align-items:center; gap:6px; background:rgba(201,162,75,.15); color:var(--gold-bright); padding:5px 10px; border-radius:14px; font-size:11.5px; font-weight:700; }
.tag-chip button{ background:none; color:inherit; font-size:13px; line-height:1; padding:0; opacity:.7; }
.tag-add-row{ display:flex; gap:8px; margin-top:10px; }
.tag-add-row input{ flex:1; }

.tabs-row{ display:flex; gap:4px; border-bottom:1px solid var(--navy-line); margin-bottom:18px; }
.tab-btn{ padding:10px 16px; font-size:13px; font-weight:700; color:var(--slate); border-bottom:2px solid transparent; background:transparent; }
.tab-btn.active{ color:var(--gold-bright); border-bottom-color:var(--gold); }
.tab-panel{ display:none; }
.tab-panel.active{ display:block; }

.detail-field{ margin-bottom:14px; }
.detail-field label{ display:block; font-size:11px; color:var(--slate); margin-bottom:5px; font-weight:600; }

.timeline-add{ display:flex; gap:8px; margin-bottom:16px; }
.timeline-add input{ flex:1; }
.timeline-list{ max-height:320px; overflow-y:auto; }
.timeline-item{ display:flex; gap:10px; padding:10px 2px; border-bottom:1px solid rgba(36,64,111,.08); }
.timeline-item:last-child{ border-bottom:none; }
.timeline-icon{ width:30px; height:30px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; background:var(--navy-panel-2); color:var(--gold); }
.timeline-icon svg{ width:14px; height:14px; }
.timeline-text{ font-size:13px; color:var(--ivory); font-weight:600; }
.timeline-meta{ font-size:11px; color:var(--slate); margin-top:2px; }

.row-name-link{ cursor:pointer; }
.row-name-link:hover{ color:var(--gold-bright); text-decoration:underline; }
.mini-contact{ display:flex; gap:6px; }
.mini-contact .icon-btn.call{ color:#2E9E5B; border-color:rgba(46,158,91,.3); }
.mini-contact .icon-btn.whatsapp{ color:#25D366; border-color:rgba(37,211,102,.3); }

.top-header{ display:flex; align-items:center; justify-content:space-between; padding:12px 28px; border-bottom:1px solid var(--navy-line); background:rgba(165,121,58,.04); flex-wrap:wrap; gap:8px; }
.top-header-company{ display:flex; align-items:center; gap:8px; font-weight:800; font-size:14px; color:var(--gold-bright); }
.top-header-user{ display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--slate); font-weight:600; cursor:pointer; }
.avatar-mini{ width:24px; height:24px; border-radius:50%; overflow:hidden; background:var(--navy-panel-2); border:1px solid var(--gold-dim); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; color:var(--gold); flex-shrink:0; }

.stage-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(88px,1fr)); gap:8px; margin-bottom:22px; }
.stage-card{ background:linear-gradient(180deg, var(--navy-panel), var(--navy)); border:1px solid var(--navy-line); border-radius:12px; padding:10px 8px; text-align:center; }
.stage-card .lbl{ font-size:10px; color:var(--slate); font-weight:600; margin-bottom:4px; line-height:1.3; }
.stage-card .val{ font-size:18px; font-weight:800; color:var(--gold-bright); }

.leader-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:22px; }
.leader-card{ background:linear-gradient(180deg, var(--navy-panel-2), var(--navy-panel)); border:1px solid var(--gold-dim); border-radius:var(--radius-lg); padding:16px; text-align:center; }
.leader-card .leader-label{ font-size:11px; color:var(--slate); font-weight:700; text-transform:uppercase; letter-spacing:.4px; margin-bottom:8px; }
.leader-card .leader-name{ font-size:16px; font-weight:800; color:var(--ivory); }
.leader-card .leader-count{ font-size:12px; color:var(--gold-bright); font-weight:700; margin-top:4px; }

function getLang(){ return localStorage.getItem("crm_lang") || "ar"; }
function setLang(lang){ localStorage.setItem("crm_lang", lang); applyLang(lang); }
function t(key){ const lang = getLang(); return (I18N[lang] && I18N[lang][key]) || key; }
function applyLang(lang){
  const dict = I18N[lang] || I18N.ar;
  document.documentElement.lang = lang;
  document.documentElement.dir = dict.dir;
  document.querySelectorAll("[data-i18n]").forEach(el => { const k = el.getAttribute("data-i18n"); if (dict[k]) el.textContent = dict[k]; });
  document.querySelectorAll(".lang-toggle button").forEach(btn => btn.classList.toggle("active", btn.dataset.lang === lang));
  document.getElementById("loadingFallbackText").textContent = dict.loading_fallback;
  document.getElementById("retryBtnText").textContent = dict.retry;
  document.dispatchEvent(new CustomEvent("langchange", { detail: { lang } }));
}
document.addEventListener("DOMContentLoaded", () => {
  applyLang(getLang());
  document.querySelectorAll(".lang-toggle button").forEach(btn => btn.addEventListener("click", () => setLang(btn.dataset.lang)));
});

/* ---------- Image helper: resize & compress to base64 ---------- */
function resizeImageFile(file, maxSize){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > height) { if (width > maxSize) { height *= maxSize/width; width = maxSize; } }
        else { if (height > maxSize) { width *= maxSize/height; height = maxSize; } }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", 0.82));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

  }
  document.querySelectorAll(".nav-item").forEach(el => el.classList.toggle("active", el.dataset.view === currentView));
  renderView();
}

    </div>`;
  bindLeadRowEvents();
}
function computeLeaderboard(){
  const now = new Date();
  const todayStr = now.toISOString().slice(0,10);
  const monthStr = now.toISOString().slice(0,7);
  const todayCounts = {}, monthCounts = {};
  ALL_ACTIVITIES.forEach(a => {
    if (!a.createdAt || !a.agentEmail) return;
    const d = a.createdAt.seconds ? new Date(a.createdAt.seconds*1000) : new Date(a.createdAt);
    const dayStr = d.toISOString().slice(0,10);
    const mStr = d.toISOString().slice(0,7);
    if (dayStr === todayStr) todayCounts[a.agentEmail] = (todayCounts[a.agentEmail]||0)+1;
    if (mStr === monthStr) monthCounts[a.agentEmail] = (monthCounts[a.agentEmail]||0)+1;
  });
  const topOf = (counts) => {
    const entries = Object.entries(counts);
    if (!entries.length) return null;
    entries.sort((a,b) => b[1]-a[1]);
    const [email, count] = entries[0];
    const agent = AGENTS.find(a => a.email === email);
    return { name: (agent && agent.name) || email, count };
  };
  return { today: topOf(todayCounts), month: topOf(monthCounts) };
}

   BULK IMPORT (Excel / CSV)
   ========================================================= */
let IMPORT_ROWS = [];

const HEADER_MAP = {
  name: ["name","الاسم","اسم","full name","الاسم الكامل","اسم العميل"],
  phone: ["phone","رقم الهاتف","الهاتف","mobile","phone number","رقم","موبايل","تليفون"],
  email: ["email","البريد الالكتروني","البريد الإلكتروني","mail","الايميل"],
  interest: ["interest","الاهتمام","نوع العقار","property","العقار"],
  budget: ["budget","الميزانية","الميزانيه"],
  source: ["source","المصدر"],
  project: ["project","المشروع"],
  campaign: ["campaign","الحملة","اسم الحملة"],
  area: ["area","المنطقة"],
  notes: ["notes","ملاحظات","note"],
};

function findHeaderKey(headers, candidates){
  for (const h of headers) {
    const norm = String(h).trim().toLowerCase();
    if (candidates.some(c => norm === c.toLowerCase())) return h;
  }
  return null;
}

function normalizeSource(val){
  if (!val) return "other";
  const v = String(val).trim().toLowerCase();
  if (v.includes("face") || v.includes("فيس")) return "facebook";
  if (v.includes("tiktok") || v.includes("تيك")) return "tiktok";
  if (v.includes("whats") || v.includes("واتس")) return "whatsapp";
  if (v.includes("web") || v.includes("موقع")) return "website";
  if (v.includes("refer") || v.includes("توصي")) return "referral";
  if (v.includes("walk") || v.includes("زيار")) return "walkin";
  if (v.includes("call") || v.includes("مكالم")) return "call";
  return "other";
}

function openImportModal(){
  IMPORT_ROWS = [];
  document.getElementById("importFileInput").value = "";
  document.getElementById("importPreview").innerHTML = "";
  document.getElementById("importProgressWrap").style.display = "none";
  document.getElementById("importProgressBar").style.width = "0%";
  document.getElementById("importStartBtn").disabled = true;
  document.getElementById("importModal").classList.add("show");
}

document.getElementById("importFileInput").addEventListener("change", (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (evt) => {
    try {
      const wb = XLSX.read(evt.target.result, { type: "array" });
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, { defval: "" });
      if (!rows.length) { document.getElementById("importPreview").textContent = t("import_no_rows"); return; }

      const headers = Object.keys(rows[0]);
      const map = {
        name: findHeaderKey(headers, HEADER_MAP.name),
        phone: findHeaderKey(headers, HEADER_MAP.phone),
        email: findHeaderKey(headers, HEADER_MAP.email),
        interest: findHeaderKey(headers, HEADER_MAP.interest),
        budget: findHeaderKey(headers, HEADER_MAP.budget),
        source: findHeaderKey(headers, HEADER_MAP.source),
        project: findHeaderKey(headers, HEADER_MAP.project),
        campaign: findHeaderKey(headers, HEADER_MAP.campaign),
        area: findHeaderKey(headers, HEADER_MAP.area),
        notes: findHeaderKey(headers, HEADER_MAP.notes),
      };

      let skipped = 0;
      IMPORT_ROWS = rows.map(r => {
        const name = map.name ? String(r[map.name]||"").trim() : "";
        if (!name) { skipped++; return null; }
        return {
          name,
          phone: map.phone ? String(r[map.phone]||"").trim() : "",
          email: map.email ? String(r[map.email]||"").trim() : "",
          interest: map.interest ? String(r[map.interest]||"").trim() : "",
          budgetFrom: map.budget ? String(r[map.budget]||"").trim() : "",
          budgetTo: "",
          project: map.project ? String(r[map.project]||"").trim() : "",
          campaign: map.campaign ? String(r[map.campaign]||"").trim() : "",
          area: map.area ? String(r[map.area]||"").trim() : "",
          source: normalizeSource(map.source ? r[map.source] : ""),
          notes: map.notes ? String(r[map.notes]||"").trim() : "",
          status: "new", rating: "warm", requirement: "buy", unitType: "apartment", paymentMethod: "cash", nextAction: "call",
        };
      }).filter(Boolean);

      let preview = `<strong style="color:var(--ivory);">${IMPORT_ROWS.length}</strong> ${t("import_of")} ${rows.length}`;
      if (skipped) preview += `<br>${t("import_row_error")}: ${skipped}`;
      document.getElementById("importPreview").innerHTML = preview;
      document.getElementById("importStartBtn").disabled = IMPORT_ROWS.length === 0;
    } catch (err) {
      console.error(err);
      document.getElementById("importPreview").textContent = t("import_no_rows");
    }
  };
  reader.readAsArrayBuffer(file);
});

document.getElementById("importStartBtn").addEventListener("click", async () => {
  if (!IMPORT_ROWS.length) return;
  const btn = document.getElementById("importStartBtn");
  btn.disabled = true;
  document.getElementById("importProgressWrap").style.display = "block";

  const CHUNK = 400;
  let done = 0;
  const total = IMPORT_ROWS.length;

  for (let i = 0; i < total; i += CHUNK) {
    const chunk = IMPORT_ROWS.slice(i, i + CHUNK);
    const batch = db.batch();
    chunk.forEach(row => {
      const ref = db.collection("leads").doc();
      batch.set(ref, {
        ...row,
        tags: [],
        agentId: CURRENT_USER.uid,
        agentEmail: CURRENT_USER.email,
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      });
    });
    try {
      await batch.commit();
      done += chunk.length;
    } catch (err) {
      console.error("import batch error", err);
      document.getElementById("importProgressText").textContent = err.message;
      break;
    }
    const pct = Math.round((done/total)*100);
    document.getElementById("importProgressBar").style.width = pct + "%";
    document.getElementById("importProgressText").textContent = `${t("import_done")} ${done} ${t("import_of")} ${total}`;
  }

  toast(`${t("import_done")} ${done} ${t("import_of")} ${total}`);
  btn.disabled = false;
  setTimeout(() => closeModal("importModal"), 1200);
});

/* ---------- Reports ---------- */
function renderReports(){
  const byStatus = {}; STATUSES.forEach(s => byStatus[s]=0);
  LEADS.forEach(l => { if (byStatus[l.status]!==undefined) byStatus[l.status]++; });
  const bySource = {}; LEADS.forEach(l => { const s=l.source||"other"; bySource[s]=(bySource[s]||0)+1; });
  const byAgent = {}; LEADS.forEach(l => { const a=l.agentEmail||"—"; byAgent[a]=(byAgent[a]||0)+1; });
  const byLostReason = {};
  LEADS.filter(l => l.status==="lost" && l.lostReason).forEach(l => { byLostReason[l.lostReason]=(byLostReason[l.lostReason]||0)+1; });
  const byCampaign = {};
  LEADS.filter(l => l.campaign).forEach(l => { byCampaign[l.campaign]=(byCampaign[l.campaign]||0)+1; });

  const roiBySource = {};
  LEADS.forEach(l => {
    const s = l.source||"other";
    if (!roiBySource[s]) roiBySource[s] = { leads:0, won:0, value:0 };
    roiBySource[s].leads++;
    if (l.status==="won") { roiBySource[s].won++; roiBySource[s].value += parseFloat(l.dealValue)||0; }
  });

  document.getElementById("content").innerHTML = `
    <div class="panel"><div class="panel-head"><h2>${t("source_roi")}</h2></div>${roiTable(roiBySource)}</div>
    <div class="panel"><div class="panel-head"><h2>${t("by_status")}</h2></div>${barList(Object.entries(byStatus).map(([k,v])=>[t('status_'+k),v]))}</div>
    <div class="panel"><div class="panel-head"><h2>${t("by_source")}</h2></div>${barList(Object.entries(bySource).map(([k,v])=>[t('source_'+k)||k,v]))}</div>
    <div class="panel"><div class="panel-head"><h2>${t("by_campaign")}</h2></div>${barList(Object.entries(byCampaign))}</div>
    <div class="panel"><div class="panel-head"><h2>${t("by_agent")}</h2></div>${barList(Object.entries(byAgent))}</div>
    <div class="panel"><div class="panel-head"><h2>${t("by_lost_reason")}</h2></div>${barList(Object.entries(byLostReason).map(([k,v])=>[t('lost_'+k)||k,v]))}</div>`;
}
function roiTable(data){
  const entries = Object.entries(data);
  if (!entries.length) return emptyState(t("empty_leads_title"), t("empty_leads_sub"));
  return `<table><thead><tr>
    <th>${t("roi_source")}</th><th>${t("roi_leads")}</th><th>${t("roi_won")}</th><th>${t("roi_rate")}</th><th>${t("roi_value")}</th>
    </tr></thead><tbody>
    ${entries.map(([src,d]) => `<tr>
      <td>${t('source_'+src)||src}</td>
      <td>${d.leads}</td>
      <td>${d.won}</td>
      <td>${d.leads ? Math.round((d.won/d.leads)*100) : 0}%</td>
      <td>${d.value ? d.value.toLocaleString() : "—"}</td>
    </tr>`).join("")}
    </tbody></table>`;
}
function barList(pairs){
  const max = Math.max(1, ...pairs.map(p=>p[1]));
  if (!pairs.length || pairs.every(p=>p[1]===0)) return emptyState(t("empty_leads_title"), t("empty_leads_sub"));
  return pairs.map(([label,val]) => `
    <div style="margin-bottom:14px;">
      <div style="display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:6px;">
        <span style="color:var(--ivory); font-weight:600;">${escapeHtml(label)}</span>
        <span style="color:var(--gold-bright); font-weight:800;">${val}</span>
      </div>
      <div style="height:8px; background:rgba(91,107,140,.12); border-radius:6px; overflow:hidden;">
        <div style="height:100%; width:${(val/max*100)}%; background:linear-gradient(90deg, var(--gold), var(--gold-bright)); border-radius:6px;"></div>
      </div>
    </div>`).join("");
}

function teamRow(a, level){
  const avatar = a.avatarBase64 ? `<img src="${a.avatarBase64}" style="width:100%;height:100%;object-fit:cover;">` : (a.name||a.email||"?").charAt(0).toUpperCase();
  const editBtn = level >= 3 ? `<button class="icon-btn" data-edit-agent="${a.id}" style="margin-inline-start:auto;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>` : "";
  return `<div class="team-row">
    <div class="team-avatar" style="overflow:hidden;">${avatar}</div>
    <div class="team-info">
      <div class="name">${escapeHtml(a.name||"—")}</div>
      <div class="email">${escapeHtml(a.email||"")}${a.role ? " · " + t("role_"+a.role) : ""}</div>
    </div>
    ${editBtn}
  </div>`;
}
function openEditAgentModal(id){
  const a = AGENTS.find(x => x.id===id);
  if (!a) return;
  document.getElementById("editAgentId").value = id;
  document.getElementById("editAgentName").value = a.name || "";
  document.getElementById("editAgentRole").value = a.role || "sales_agent";
  document.getElementById("editAgentModal").classList.add("show");
}
document.getElementById("editAgentForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const id = document.getElementById("editAgentId").value;
  await db.collection("agents").doc(id).update({
    name: document.getElementById("editAgentName").value.trim(),
    role: document.getElementById("editAgentRole").value,
  });
  toast(t("toast_updated"));
  closeModal("editAgentModal");
});

/* ---------- My Profile ---------- */
function openProfileModal(){
  const mine = myAgentDoc();
  document.getElementById("profileName").value = (mine && mine.name) || (CURRENT_USER.email.split("@")[0]);
  const preview = document.getElementById("profileAvatarPreview");
  preview.innerHTML = (mine && mine.avatarBase64) ? `<img src="${mine.avatarBase64}" style="width:100%;height:100%;object-fit:cover;">` : CURRENT_USER.email.charAt(0).toUpperCase();
  preview.dataset.pending = "";
  document.getElementById("profileAvatarInput").value = "";
  document.getElementById("profileModal").classList.add("show");
}
document.getElementById("profileAvatarInput").addEventListener("change", async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const base64 = await resizeImageFile(file, 200);
  document.getElementById("profileAvatarPreview").innerHTML = `<img src="${base64}" style="width:100%;height:100%;object-fit:cover;">`;
  document.getElementById("profileAvatarPreview").dataset.pending = base64;
});
document.getElementById("profileForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const mine = myAgentDoc();
  const pending = document.getElementById("profileAvatarPreview").dataset.pending;
  const data = { name: document.getElementById("profileName").value.trim(), email: CURRENT_USER.email };
  if (!mine) { data.role = "general_manager"; data.createdAt = firebase.firestore.FieldValue.serverTimestamp(); }
  if (pending) data.avatarBase64 = pending;
  await db.collection("agents").doc(CURRENT_USER.uid).set(data, { merge: true });
  toast(t("toast_profile_saved"));
  closeModal("profileModal");
});

/* ---------- Permissions ---------- */
const ADMIN_ROLES = ["general_manager","company_admin"];
const MID_ROLES = ["sales_manager","marketing_manager","sales_team_leader","marketing_team_leader","sales_supervisor","marketing_supervisor"];
function myAgentDoc(){ return AGENTS.find(a => a.id === (CURRENT_USER && CURRENT_USER.uid)); }
function myRole(){ const a = myAgentDoc(); return a && a.role ? a.role : "general_manager"; }
function permLevel(){ const r = myRole(); if (ADMIN_ROLES.includes(r)) return 3; if (MID_ROLES.includes(r)) return 2; return 1; }

function applyPermissions(){
  const level = permLevel();
  const teamNav = document.querySelector('.nav-item[data-view="team"]');
  const accountsNav = document.querySelector('.nav-item[data-view="accounts"]');
  const reportsNav = document.querySelector('.nav-item[data-view="reports"]');
  if (teamNav) teamNav.style.display = level >= 3 ? "flex" : "none";
  if (accountsNav) accountsNav.style.display = level >= 2 ? "flex" : "none";
  if (reportsNav) reportsNav.style.display = level >= 2 ? "flex" : "none";

  const mine = myAgentDoc();
  const displayName = (mine && mine.name) || CURRENT_USER.email.split("@")[0];
  const avatarHtml = (mine && mine.avatarBase64) ? `<img src="${mine.avatarBase64}" style="width:100%;height:100%;object-fit:cover;">` : CURRENT_USER.email.charAt(0).toUpperCase();
  document.getElementById("userName").textContent = displayName;
  document.getElementById("userAvatar").innerHTML = avatarHtml;
  document.getElementById("topHeaderUserName").textContent = displayName;
  document.getElementById("topHeaderAvatar").innerHTML = avatarHtml;

  const restricted = { team:3, accounts:2, reports:2 };
  if (restricted[currentView] && level < restricted[currentView]) {
    window.location.hash = "#dashboard";
  }
}

/* =========================================================
   ACCOUNTS (Developer companies / Brokers)
   ========================================================= */
function renderAccounts(){
  document.getElementById("content").innerHTML = `<div class="panel">${ACCOUNTS.length ? accountsTable(ACCOUNTS) : emptyState(t("empty_accounts_title"), t("empty_accounts_sub"))}</div>`;
  bindAccountRowEvents();
}
function accountsTable(list){
  return `<table><thead><tr>
    <th>${t("col_account_name")}</th><th>${t("col_account_type")}</th><th>${t("col_account_contact")}</th><th>${t("col_phone")}</th><th>${t("col_actions")}</th>
    </tr></thead><tbody>
    ${list.map(a => `<tr>
      <td>${escapeHtml(a.name||"")}</td>
      <td>${t('account_type_'+(a.type||"developer"))}</td>
      <td>${escapeHtml(a.contact||"—")}</td>
      <td>${escapeHtml(a.phone||"—")}</td>
      <td class="row-actions">
        <button class="icon-btn" data-edit-account="${a.id}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
        <button class="icon-btn" data-delete-account="${a.id}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg></button>
      </td>
    </tr>`).join("")}
    </tbody></table>`;
}
function bindAccountRowEvents(){
  document.querySelectorAll("[data-edit-account]").forEach(btn => btn.addEventListener("click", () => openAccountModal(btn.dataset.editAccount)));
  document.querySelectorAll("[data-delete-account]").forEach(btn => btn.addEventListener("click", async () => {
    if (!confirm(t("confirm_delete"))) return;
    await db.collection("accounts").doc(btn.dataset.deleteAccount).delete();
    toast(t("toast_deleted"));
  }));
}
function openAccountModal(id){
  const form = document.getElementById("accountForm");
  form.reset();
  document.getElementById("accountId").value = id || "";
  document.getElementById("accountModalTitle").textContent = id ? t("modal_edit_account") : t("modal_add_account");
  if (id) {
    const acc = ACCOUNTS.find(a => a.id===id);
    if (acc) {
      document.getElementById("accountName").value = acc.name||"";
      document.getElementById("accountType").value = acc.type||"developer";
      document.getElementById("accountContact").value = acc.contact||"";
      document.getElementById("accountPhone").value = acc.phone||"";
      document.getElementById("accountEmail").value = acc.email||"";
      document.getElementById("accountNotes").value = acc.notes||"";
    }
  }
  document.getElementById("accountModal").classList.add("show");
}
document.getElementById("accountForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const id = document.getElementById("accountId").value;
  const data = {
    name: document.getElementById("accountName").value.trim(),
    type: document.getElementById("accountType").value,
    contact: document.getElementById("accountContact").value.trim(),
    phone: document.getElementById("accountPhone").value.trim(),
    email: document.getElementById("accountEmail").value.trim(),
    notes: document.getElementById("accountNotes").value.trim(),
  };
  try {
    if (id) { await db.collection("accounts").doc(id).update(data); toast(t("toast_updated")); }
    else {
      data.createdAt = firebase.firestore.FieldValue.serverTimestamp();
      data.agentId = CURRENT_USER.uid;
      await db.collection("accounts").add(data);
      toast(t("toast_saved"));
    }
    closeModal("accountModal");
  } catch (err) { console.error(err); alert(err.message); }
});

function openEmployeeModal(){
  document.getElementById("employeeForm").reset();
  document.getElementById("employeeModal").classList.add("show");
}
document.getElementById("employeeForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const name = document.getElementById("employeeName").value.trim();
  const email = document.getElementById("employeeEmail").value.trim();
  const password = document.getElementById("employeePassword").value;
  const role = document.getElementById("employeeRole").value;
  const submitBtn = e.target.querySelector('button[type="submit"]');
  submitBtn.disabled = true;

  // Use a secondary Firebase app instance so creating the new account
  // does not sign the current admin out of their own session.
  const secondaryApp = firebase.initializeApp(firebaseConfig, "Secondary-" + Date.now());
  try {
    const cred = await secondaryApp.auth().createUserWithEmailAndPassword(email, password);
    await db.collection("agents").doc(cred.user.uid).set({
      name, email, role,
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      addedBy: CURRENT_USER.uid,
    });
    await secondaryApp.auth().signOut();
    toast(t("toast_employee_added"));
    closeModal("employeeModal");
  } catch (err) {
    console.error(err);
    alert(err.message);
  } finally {
    submitBtn.disabled = false;
    secondaryApp.delete();
  }
});

/* =========================================================
   LEAD DETAIL (Profile / Timeline / Tags / Quick Contact)
   ========================================================= */
let DETAIL_LEAD_ID = null;
let DETAIL_TAGS = [];
let timelineUnsub = null;

const ACT_ICONS = {
  created: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>',
  call: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.12.9.34 1.79.65 2.65a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.43-1.42a2 2 0 0 1 2.11-.45c.86.31 1.75.53 2.65.65A2 2 0 0 1 22 16.92z"/></svg>',
  whatsapp: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.5 15.2L2 22l4.9-1.5A10 10 0 1 0 12 2z"/></svg>',
  sms: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>',
  status: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>',
  note: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>',
  task: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>',
  updated: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>',
};

function cleanPhone(p){ return (p||"").replace(/[^\d+]/g,""); }
function waPhone(p){
  let d = (p||"").replace(/\D/g,"");
  if (d.startsWith("0")) d = "20" + d.slice(1);
  return d;
}
async function logActivity(leadId, type, text){
  try {
    await db.collection("leads").doc(leadId).collection("activities").add({
      type, text,
      agentEmail: CURRENT_USER ? CURRENT_USER.email : "",
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
    });
  } catch(err){ console.error("activity log error", err); }
}
function doCall(phone, leadId){
  if (!phone) return;
  window.location.href = "tel:" + cleanPhone(phone);
  if (leadId) logActivity(leadId, "call", t("act_call"));
}
function doWhatsapp(phone, leadId){
  if (!phone) return;
  window.open("https://wa.me/" + waPhone(phone), "_blank");
  if (leadId) logActivity(leadId, "whatsapp", t("act_whatsapp"));
}
function doSms(phone, leadId){
  if (!phone) return;
  window.location.href = "sms:" + cleanPhone(phone);
  if (leadId) logActivity(leadId, "sms", t("act_sms"));
}

function openLeadDetail(id){
  const lead = LEADS.find(l => l.id===id);
  if (!lead) return;
  DETAIL_LEAD_ID = id;
  DETAIL_TAGS = Array.isArray(lead.tags) ? [...lead.tags] : [];

  document.getElementById("detailLeadName").textContent = lead.name || "—";
  document.getElementById("detailLeadId").value = id;
  document.getElementById("detailStatus").value = lead.status || "new";
  document.getElementById("detailRating").value = lead.rating || "warm";
  document.getElementById("detailInterest").value = lead.interest || "";
  document.getElementById("detailSource").value = lead.source || "facebook";
  document.getElementById("detailRequirement").value = lead.requirement || "buy";
  document.getElementById("detailProject").value = lead.project || "";
  document.getElementById("detailCampaign").value = lead.campaign || "";
  document.getElementById("detailUnitType").value = lead.unitType || "apartment";
  document.getElementById("detailArea").value = lead.area || "";
  document.getElementById("detailBudgetFrom").value = lead.budgetFrom || "";
  document.getElementById("detailBudgetTo").value = lead.budgetTo || "";
  document.getElementById("detailPaymentMethod").value = lead.paymentMethod || "cash";
  document.getElementById("detailNextAction").value = lead.nextAction || "call";
  document.getElementById("detailExpectedClosing").value = lead.expectedClosing || "";
  document.getElementById("detailDealValue").value = lead.dealValue || "";
  document.getElementById("detailLostReason").value = lead.lostReason || "";
  document.getElementById("detailNotes").value = lead.notes || "";

  const assignedSelect = document.getElementById("detailAssigned");
  assignedSelect.innerHTML = `<option value="">${t("unassigned")}</option>` + AGENTS.map(a => `<option value="${a.id}">${escapeHtml(a.name||a.email)}</option>`).join("");
  assignedSelect.value = lead.assignedTo || "";

  const accountSelect = document.getElementById("detailAccount");
  accountSelect.innerHTML = `<option value="">${t("unlinked")}</option>` + ACCOUNTS.map(a => `<option value="${a.id}">${escapeHtml(a.name)}</option>`).join("");
  accountSelect.value = lead.accountId || "";

  renderDetailQuickContact(lead);
  renderDetailTags();
  switchDetailTab("profile");
  subscribeTimeline(id);

  document.getElementById("leadDetailModal").classList.add("show");
}

function renderDetailQuickContact(lead){
  const phone = lead.phone || "";
  document.getElementById("detailQuickContact").innerHTML = `
    <button type="button" class="quick-contact-btn call" data-qc-call>${ACT_ICONS.call}</button>
    <button type="button" class="quick-contact-btn sms" data-qc-sms>${ACT_ICONS.sms}</button>
    <button type="button" class="quick-contact-btn whatsapp" data-qc-whatsapp>${ACT_ICONS.whatsapp}</button>
    <div class="quick-contact-label"><div class="num">${escapeHtml(phone||"—")}</div><div class="lbl">${escapeHtml(lead.interest||"")}</div></div>
  `;
  const qc = document.getElementById("detailQuickContact");
  qc.querySelector("[data-qc-call]").addEventListener("click", () => doCall(phone, DETAIL_LEAD_ID));
  qc.querySelector("[data-qc-sms]").addEventListener("click", () => doSms(phone, DETAIL_LEAD_ID));
  qc.querySelector("[data-qc-whatsapp]").addEventListener("click", () => doWhatsapp(phone, DETAIL_LEAD_ID));
}

function renderDetailTags(){
  document.getElementById("detailTagList").innerHTML = DETAIL_TAGS.map(tag => `
    <span class="tag-chip">${escapeHtml(tag)}<button type="button" data-remove-tag="${escapeHtml(tag)}">✕</button></span>
  `).join("") || "";
  document.querySelectorAll("[data-remove-tag]").forEach(btn => btn.addEventListener("click", () => {
    DETAIL_TAGS = DETAIL_TAGS.filter(tg => tg !== btn.dataset.removeTag);
    renderDetailTags();
  }));
}
document.getElementById("detailTagAddBtn").addEventListener("click", () => {
  const input = document.getElementById("detailTagInput");
  const val = input.value.trim();
  if (val && !DETAIL_TAGS.includes(val)) { DETAIL_TAGS.push(val); renderDetailTags(); }
  input.value = "";
});

document.querySelectorAll(".tab-btn").forEach(btn => btn.addEventListener("click", () => switchDetailTab(btn.dataset.tab)));
function switchDetailTab(tab){
  document.querySelectorAll(".tab-btn").forEach(b => b.classList.toggle("active", b.dataset.tab===tab));
  document.getElementById("tabProfile").classList.toggle("active", tab==="profile");
  document.getElementById("tabTimeline").classList.toggle("active", tab==="timeline");
}

function subscribeTimeline(leadId){
  if (timelineUnsub) timelineUnsub();
  timelineUnsub = db.collection("leads").doc(leadId).collection("activities").orderBy("createdAt","desc")
    .onSnapshot(snap => {
      const items = snap.docs.map(d => d.data());
      const list = document.getElementById("detailTimelineList");
      if (!items.length) { list.innerHTML = emptyState(t("empty_tasks_title"), t("empty_tasks_sub")); return; }
      list.innerHTML = items.map(a => `
        <div class="timeline-item">
          <div class="timeline-icon">${ACT_ICONS[a.type]||ACT_ICONS.note}</div>
          <div>
            <div class="timeline-text">${escapeHtml(a.text||"")}</div>
            <div class="timeline-meta">${escapeHtml(a.agentEmail||"")} · ${fmtDate(a.createdAt)}</div>
          </div>
        </div>`).join("");
    }, err => console.error("timeline error", err));
}

document.getElementById("detailNoteAddBtn").addEventListener("click", async () => {
  const input = document.getElementById("detailNoteInput");
  const val = input.value.trim();
  if (!val || !DETAIL_LEAD_ID) return;
  await logActivity(DETAIL_LEAD_ID, "note", val);
  input.value = "";
});

document.getElementById("detailNewTaskBtn").addEventListener("click", () => {
  if (!DETAIL_LEAD_ID) return;
  openTaskModal();
  document.getElementById("taskLead").value = DETAIL_LEAD_ID;
});

document.getElementById("detailForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const id = document.getElementById("detailLeadId").value;
  const lead = LEADS.find(l => l.id===id) || {};
  const newStatus = document.getElementById("detailStatus").value;
  const statusChanged = lead.status !== newStatus;

  const data = {
    status: newStatus,
    rating: document.getElementById("detailRating").value,
    interest: document.getElementById("detailInterest").value.trim(),
    source: document.getElementById("detailSource").value,
    requirement: document.getElementById("detailRequirement").value,
    project: document.getElementById("detailProject").value.trim(),
    campaign: document.getElementById("detailCampaign").value.trim(),
    unitType: document.getElementById("detailUnitType").value,
    area: document.getElementById("detailArea").value.trim(),
    budgetFrom: document.getElementById("detailBudgetFrom").value.trim(),
    budgetTo: document.getElementById("detailBudgetTo").value.trim(),
    paymentMethod: document.getElementById("detailPaymentMethod").value,
    nextAction: document.getElementById("detailNextAction").value,
    expectedClosing: document.getElementById("detailExpectedClosing").value,
    dealValue: document.getElementById("detailDealValue").value.trim(),
    lostReason: document.getElementById("detailLostReason").value,
    assignedTo: document.getElementById("detailAssigned").value || null,
    accountId: document.getElementById("detailAccount").value || null,
    notes: document.getElementById("detailNotes").value.trim(),
    tags: DETAIL_TAGS,
  };
  try {
    await db.collection("leads").doc(id).update(data);
    if (statusChanged) {
      let msg = t("act_status") + " " + t("status_"+newStatus);
      if (newStatus === "lost" && data.lostReason) msg += " (" + t("lost_"+data.lostReason) + ")";
      await logActivity(id, "status", msg);
    }
    else await logActivity(id, "updated", t("act_updated"));
    toast(t("toast_updated"));
    closeModal("leadDetailModal");
  } catch(err){ console.error(err); alert(err.message); }
});

/* ---------- Modals ---------- */
function closeModal(id){
  document.getElementById(id).classList.remove("show");
  if (id === "leadDetailModal" && timelineUnsub) { timelineUnsub(); timelineUnsub = null; }
}
document.querySelectorAll("[data-close-modal]").forEach(btn => btn.addEventListener("click", () => closeModal(btn.dataset.closeModal)));
document.querySelectorAll(".modal-backdrop").forEach(backdrop => backdrop.addEventListener("click", e => { if (e.target===backdrop) backdrop.classList.remove("show"); }));
</script>
